# Infracost Configuration
# This file configures Infracost for cost estimation across all environments

version: "0.1"

# Auto-detect Terraform/Terragrunt projects
projects:
  - path: dev/vpc
    name: dev-vpc
    terraform_var_files:
      - ../../env/dev.tfvars

  - path: dev/app/ec2
    name: dev-ec2
    terraform_var_files:
      - ../../../env/dev.tfvars

  - path: dev/app/alb
    name: dev-alb
    terraform_var_files:
      - ../../../env/dev.tfvars

  - path: production/vpc
    name: production-vpc
    terraform_var_files:
      - ../../env/production.tfvars

  - path: production/app/ec2
    name: production-ec2
    terraform_var_files:
      - ../../../env/production.tfvars

  - path: production/app/alb
    name: production-alb
    terraform_var_files:
      - ../../../env/production.tfvars

  - path: load-testing/vpc
    name: load-testing-vpc
    terraform_var_files:
      - ../../env/load-testing.tfvars

  - path: load-testing/app/ec2
    name: load-testing-ec2
    terraform_var_files:
      - ../../../env/load-testing.tfvars

  - path: load-testing/app/alb
    name: load-testing-alb
    terraform_var_files:
      - ../../../env/load-testing.tfvars
